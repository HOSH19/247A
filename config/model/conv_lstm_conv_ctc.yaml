# @package _global_
module:
  _target_: emg2qwerty.lightning.ConvLSTMConvCTCModule
  in_features: 528
  mlp_features: [384]
  hidden_size: 384
  num_layers: 2
  conv_kernel_size: 31   # ~248ms at 125Hz (same as Conformer depthwise kernel)
  dropout: 0.1

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]
